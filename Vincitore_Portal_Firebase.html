<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vincitore — Agency Briefing Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#B8973A;--dgold:#8A6E25;--lgold:#FDF6E3;--egold:#F5EDD0;
  --dark:#0C0B09;--dark2:#1C1912;--cream:#F5F0E8;
  --text:#1a1a1a;--muted:#666;--border:#e8e4d8;
  --green:#1E7E34;--red:#C0392B;--blue:#1A4D8A;--orange:#D97706;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
input,select,textarea,button{font-family:inherit}

/* AUTH */
#authScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark),var(--dark2))}
.auth-card{background:#fff;border-radius:16px;padding:2.5rem;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-logo{text-align:center;margin-bottom:1.75rem}
.auth-logo img{width:80px;height:80px;object-fit:contain;margin-bottom:10px}
.auth-logo h1{font-size:16px;font-weight:700;color:var(--dark);letter-spacing:.08em;margin-bottom:3px}
.auth-logo p{font-size:11px;color:var(--muted);letter-spacing:.06em}
.auth-error{background:#fff0f0;border:1px solid #fcc;color:var(--red);padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;display:none}
.form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.form-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border .2s;margin-bottom:14px}
.form-input:focus{border-color:var(--gold)}
.auth-btn{width:100%;padding:12px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s}
.auth-btn:hover{background:var(--dgold)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.connecting{text-align:center;color:var(--muted);font-size:13px;padding:1rem}

/* LAYOUT */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:var(--dark);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left img{height:38px;object-fit:contain}
.topbar-divider{color:#444;font-size:18px}
.topbar-title{font-size:13px;color:#aaa}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-user{font-size:12px;color:#ccc}
.role-badge{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:10px}
.role-sales{background:rgba(30,126,52,.2);color:#4caf7d}
.role-admin{background:rgba(26,77,138,.2);color:#5b8dd9}
.role-superadmin{background:rgba(184,151,58,.2);color:var(--gold)}
.topbar-btn{background:none;border:1px solid #444;color:#aaa;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .2s}
.topbar-btn:hover{border-color:#888;color:#fff}
.topbar-btn.gold{border-color:var(--gold);color:var(--gold)}
.topbar-btn.gold:hover{background:var(--gold);color:#fff}
.save-ind{font-size:11px;color:#4caf7d;opacity:0;transition:opacity .5s}
.main{display:flex;flex:1;min-height:calc(100vh - 56px)}

/* SIDEBAR */
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);padding:1rem 0;flex-shrink:0}
.nav-section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 20px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;margin:1px 8px;border-radius:8px}
.nav-item:hover{background:var(--lgold);color:var(--dgold)}
.nav-item.active{background:var(--egold);color:var(--dgold);font-weight:600}

/* CONTENT */
.content{flex:1;padding:1.5rem;overflow-y:auto;background:var(--cream)}
.page-header{margin-bottom:1.5rem}
.ph-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.page-title{font-size:22px;font-weight:600;color:var(--dark)}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* CARDS */
.card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:13px;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}

/* STATS */
.stat{background:#fff;border-radius:10px;border:1px solid var(--border);padding:1.25rem;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-n{font-size:32px;font-weight:700;color:var(--gold);line-height:1}
.stat-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--dgold)}
.btn-outline{background:#fff;color:var(--dgold);border:1.5px solid var(--gold)}.btn-outline:hover{background:var(--lgold)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#a02020}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#166028}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.badge-confirmed{background:#e8f5e9;color:var(--green)}
.badge-attended{background:#e3f2fd;color:var(--blue)}
.badge-noshow{background:#fce4ec;color:var(--red)}
.badge-cancelled{background:#f5f5f5;color:#999}

/* VENUE TABS */
.venue-tabs{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.venue-tab{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);background:#fff;transition:all .15s}
.venue-tab.active{border-color:var(--gold);background:var(--egold);color:var(--dgold);font-weight:600}

/* CALENDAR GRID */
.cal-wrap{overflow-x:auto}
.cal-table{border-collapse:collapse;min-width:100%;font-size:12px}
.cal-table th{background:var(--dark);color:#fff;padding:10px 8px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap;border:1px solid #333;min-width:130px}
.cal-table th.slot-th{background:var(--dgold);min-width:110px}
.cal-table td{border:1px solid var(--border);padding:4px;vertical-align:top}
.slot-lbl{background:var(--egold);padding:9px 8px;font-size:11px;font-weight:600;color:var(--dgold);text-align:center;white-space:nowrap}
.slot-cell{background:#fff;min-height:72px;padding:4px;cursor:pointer;transition:background .15s;border-radius:4px}
.slot-cell:hover{background:var(--lgold)}
.slot-cell.is-full{background:#fff5f5;cursor:default}.slot-cell.is-full:hover{background:#fff5f5}
.slot-count{font-size:10px;color:var(--muted);margin-bottom:3px}
.pax-bar{height:4px;background:#eee;border-radius:2px;margin-top:4px;overflow:hidden}
.pax-fill{height:100%;border-radius:2px;transition:width .3s}
.bk-chip{border-radius:4px;padding:3px 6px;margin:2px 0;font-size:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bk-chip.mine{background:#e8f5e9;border:1px solid #b2dfdb;color:var(--green)}
.bk-chip.other{background:var(--lgold);border:1px solid #e8d9a0;color:var(--dgold)}
.bk-chip.masked{background:#f5f5f5;border:1px solid #e0e0e0;color:#aaa}
.add-btn{display:flex;align-items:center;justify-content:center;border:1.5px dashed #ddd;border-radius:4px;padding:5px;color:#aaa;font-size:11px;cursor:pointer;transition:all .15s;margin-top:3px}
.add-btn:hover{border-color:var(--gold);color:var(--gold)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-hdr{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:600}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:1.5rem}
.modal-foot{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.fg label.req::after{content:" *";color:var(--red)}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;transition:border .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg textarea{resize:vertical;min-height:70px}
.fg .hint{font-size:11px;color:var(--muted);margin-top:3px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.alert-info{background:#e3f2fd;border:1px solid #bbdefb;color:var(--blue)}
.alert-warn{background:#fff8e1;border:1px solid #ffe082;color:var(--orange)}
.alert-success{background:#e8f5e9;border:1px solid #c8e6c9;color:var(--green)}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--border);background:var(--lgold)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--lgold)}

/* CONFIG */
.cfg-section{margin-bottom:1.5rem}
.cfg-title{font-size:15px;font-weight:600;margin-bottom:1rem;padding-bottom:8px;border-bottom:1px solid var(--border)}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:1rem}
.venue-cfg{border:1px solid var(--border);border-radius:8px;padding:1rem;background:var(--lgold);margin-bottom:.75rem}

/* EMPTY */
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty .ei{font-size:40px;margin-bottom:.75rem}
.empty p{font-size:14px}

/* LOADING */
.loading{text-align:center;padding:3rem;color:var(--muted)}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>

<!-- LOGIN -->

      <p>AGENCY BRIEFING PORTAL · SIP LAUNCH</p>

      <input class="form-input" type="text" id="loginUser" placeholder="Enter username" autocomplete="username">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="loginPass" placeholder="Enter password">
      <button class="auth-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <img id="topbarLogo" alt="Vincitore">
      <span class="topbar-divider">|</span>
      <span class="topbar-title">Agency Briefing Portal</span>
    </div>
    <div class="topbar-right">
      <span class="save-ind" id="saveInd">✓ Saved</span>
      <span class="topbar-user" id="topbarUser"></span>
      <span class="role-badge" id="topbarRole"></span>
      <button class="topbar-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modalTitle">Modal</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

    DEFAULT_USERS.forEach(u => { seed.users[u.id] = u; });
    return db.ref('/').set(seed);
  }
}).then(() => {
  // Start listeners
  startListeners();
  document.getElementById('connectingMsg').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
}).catch(err => {
  document.getElementById('connectingMsg').innerHTML = '❌ Connection failed. Check your internet connection.<br><small>'+err.message+'</small>';
});

function startListeners() {
  // Config listener
  var cfgRef = db.ref('/config');
  cfgRef.on('value', snap => { CACHE.config = snap.val(); if(CU) rerender(); });
  LISTENERS.push(cfgRef);

  // Users listener
  var usersRef = db.ref('/users');
  usersRef.on('value', snap => { CACHE.users = snap.val() || {}; if(CU) rerender(); });
  LISTENERS.push(usersRef);

  // Bookings listener
  var bkRef = db.ref('/bookings');
  bkRef.on('value', snap => { CACHE.bookings = snap.val() || {}; if(CU) rerender(); });
  LISTENERS.push(bkRef);
}

function rerender() {
  var pages = {
    dashboard: renderDashboard, calendar: renderCalendar,
    mybookings: renderMyBookings, allbookings: renderAllBookings,
    agencies: renderAgencies, users: renderUsers, config: renderConfig
  };
  if (pages[PAGE]) pages[PAGE]();
}

// ═══════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════
function uid() { return 'b' + Date.now() + Math.random().toString(36).substr(2,5); }
function pad(n) { return n < 10 ? '0'+n : n; }

function getDays() {
  if (!CACHE.config) return [];
  var days = [], d = new Date(CACHE.config.startDate + 'T00:00:00');
  var end = new Date(CACHE.config.endDate + 'T00:00:00');
  while (d <= end) {
    var y=d.getFullYear(), mo=d.getMonth()+1, dy=d.getDate();
    days.push(y+'-'+pad(mo)+'-'+pad(dy));
    d.setDate(d.getDate()+1);
  }
  return days;
}

function getSlots() {
  if (!CACHE.config) return [];
  var slots = [];
  var [sh,sm] = CACHE.config.slotStart.split(':').map(Number);
  var [eh,em] = CACHE.config.slotEnd.split(':').map(Number);
  var cur = sh*60+sm, endM = eh*60+em, dur = parseInt(CACHE.config.slotDuration);
  while (cur + dur <= endM) {
    var h1=Math.floor(cur/60), m1=cur%60, h2=Math.floor((cur+dur)/60), m2=(cur+dur)%60;
    var fmt = h => h%12===0?12:h%12, ap = h => h<12?'AM':'PM';
    slots.push({ key: pad(h1)+':'+pad(m1), label: fmt(h1)+':'+pad(m1)+ap(h1)+' – '+fmt(h2)+':'+pad(m2)+ap(h2) });
    cur += dur;
  }
  return slots;
}

function fmtDate(s) {
  var d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function fmtDT(s) {
  if (!s) return '—';
  var d = new Date(s);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function getVenue(id) { return (CACHE.config.venues||[]).find(v=>v.id===id); }
function getUser(id) { return CACHE.users[id]; }
function allBookings() { return Object.values(CACHE.bookings); }
function activeBookings() { return allBookings().filter(b=>b.status!=='cancelled'); }

function slotBookings(venueId, date, slotKey) {
  return activeBookings().filter(b=>b.venueId===venueId&&b.date===date&&b.slotKey===slotKey);
}
function slotPax(venueId, date, slotKey) {
  return slotBookings(venueId,date,slotKey).reduce((s,b)=>s+parseInt(b.attendees||1),0);
}
function canSeeDetail(b) {
  if (!CU) return false;
  if (CU.role !== 'sales') return true;
  return b.bookedBy === CU.id;
}

function showSaved() {
  var el = document.getElementById('saveInd');
  if (el) { el.style.opacity='1'; setTimeout(()=>el.style.opacity='0', 1500); }
}

      <div class="stat"><div class="stat-n">${mine.reduce((s,b)=>s+parseInt(b.attendees||1),0)}</div><div class="stat-l">My Total Pax</div></div>
      <div class="stat"><div class="stat-n">${mine.filter(b=>b.status==='attended').length}</div><div class="stat-l">Attended</div></div>

    html += `<div class="g4" style="margin-bottom:1.25rem">
      <div class="stat"><div class="stat-n">${active.length}</div><div class="stat-l">Total Bookings</div></div>
      <div class="stat"><div class="stat-n">${totalPax}</div><div class="stat-l">Total Pax</div></div>
      <div class="stat"><div class="stat-n">${active.filter(b=>b.status==='attended').length}</div><div class="stat-l">Attended</div></div>
      <div class="stat"><div class="stat-n">${agencies}</div><div class="stat-l">Agencies</div></div>

  (CACHE.config.venues||[]).forEach(v=>{
    var vb = active.filter(b=>b.venueId===v.id);

    var maxC = slots.length * days.length * v.capacity;

      </div>

// ═══════════════════════════════════════════════════════════════════
// CALENDAR
// ═══════════════════════════════════════════════════════════════════
function renderCalendar() {
  var days = getDays(), slots = getSlots();
  var venues = CACHE.config.venues || [];
  var venue = venues[VENUE_IDX];
  if (!venue) { VENUE_IDX=0; venue=venues[0]; }

  var html = `<div class="page-header"><div class="ph-row">
    <div><div class="page-title">📅 Booking Calendar</div>
    <div class="page-sub">${days.length} days · ${slots.length} slots/day · ${venue.capacity} pax max per slot</div></div>
  </div></div>`;

  // Venue tabs
  html += '<div class="venue-tabs">';
  venues.forEach((v,i)=>{
    var cnt = activeBookings().filter(b=>b.venueId===v.id).length;
    html += `<div class="venue-tab${VENUE_IDX===i?' active':''}" onclick="switchVenue(${i})">🏢 ${v.name} <span style="font-size:11px;color:var(--muted)">${cnt} booked</span></div>`;
  });
  html += '</div>';

  html += `<div style="display:flex;gap:12px;margin-bottom:1rem;font-size:12px;flex-wrap:wrap">
    <span>🟢 Available</span><span>🟡 Partial</span><span>🔴 Full</span>
    ${CU.role==='sales'?'<span>🟩 My booking</span>':''}
  </div>`;

  html += '<div class="cal-wrap"><table class="cal-table"><thead><tr><th class="slot-th">Time Slot</th>';
  days.forEach(d=>{ html += `<th>${fmtDate(d)}</th>`; });
  html += '</tr></thead><tbody>';

  slots.forEach(slot=>{
    html += `<tr><td><div class="slot-lbl">${slot.label}</div></td>`;
    days.forEach(date=>{
      var pax = slotPax(venue.id, date, slot.key);
      var bks = slotBookings(venue.id, date, slot.key);
      var cap = venue.capacity;
      var full = pax >= cap;
      var pct = Math.min(100, Math.round(pax/cap*100));
      var fillC = full?'#ef9a9a':pct>50?'#ffe082':'#a5d6a7';
      html += `<td><div class="slot-cell${full?' is-full':''}" onclick="${full?'':("openBook('"+venue.id+"','"+date+"','"+slot.key+"')")}">`;
      html += `<div class="slot-count" style="color:${full?'var(--red)':pax>0?'var(--orange)':'var(--muted)'}">${pax}/${cap} pax ${full?'🔴':pax>0?'🟡':'🟢'}</div>`;
      bks.forEach(b=>{
        var mine = b.bookedBy===CU.id;
        var show = canSeeDetail(b);
        if (show) {
          var nm = b.agencyName; if(nm.length>16) nm=nm.substring(0,15)+'…';
          html += `<div class="bk-chip ${mine?'mine':'other'}" onclick="event.stopPropagation();viewBooking('${b.id}')">🏢 ${nm}</div>`;
        } else {
          html += `<div class="bk-chip masked">${b.attendees} pax</div>`;
        }
      });
      if (!full) html += `<div class="add-btn">+ Book</div>`;
      html += `</div><div class="pax-bar"><div class="pax-fill" style="width:${pct}%;background:${fillC}"></div></div></td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

function switchVenue(i) { VENUE_IDX=i; renderCalendar(); }

// ═══════════════════════════════════════════════════════════════════
// BOOKING MODAL — new
// ═══════════════════════════════════════════════════════════════════
function openBook(venueId, date, slotKey) {
  var venue = getVenue(venueId);
  var slot = getSlots().find(s=>s.key===slotKey);
  var pax = slotPax(venueId, date, slotKey);
  var remaining = venue.capacity - pax;

  document.getElementById('modalTitle').textContent = 'New Booking';
  document.getElementById('modalBody').innerHTML = `
    <div class="alert alert-info">📅 ${fmtDate(date)} · ${slot?slot.label:''} · ${venue.name}</div>
    <div class="alert alert-${remaining<10?'warn':'success'}">${remaining} pax remaining in this slot</div>
    <div class="fr2">
      <div class="fg"><label class="req">Agency Name</label><input type="text" id="f_agency" placeholder="Agency name"></div>
      <div class="fg"><label class="req">Owner / Contact Name</label><input type="text" id="f_owner" placeholder="Full name"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label class="req">Phone Number</label><input type="tel" id="f_phone" placeholder="+971 XX XXX XXXX"></div>
      <div class="fg"><label class="req">Number of Attendees</label>
        <input type="number" id="f_att" min="1" max="${remaining}" value="1">
        <div class="hint">Max ${remaining} pax remaining</div></div>
    </div>
    <div class="fg"><label>Notes (optional)</label>
      <textarea id="f_notes" placeholder="Any context or follow-up notes…"></textarea>
      ${CU.role==='sales'?'<div class="hint">Notes visible to Admin and Super Admin only</div>':''}</div>`;
  document.getElementById('modalFoot').innerHTML = `
    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    <button class="btn btn-gold" onclick="submitBook('${venueId}','${date}','${slotKey}')">Confirm Booking</button>`;
  document.getElementById('modal').style.display='flex';
}

function submitBook(venueId, date, slotKey) {
  var agency = document.getElementById('f_agency').value.trim();
  var owner  = document.getElementById('f_owner').value.trim();
  var phone  = document.getElementById('f_phone').value.trim();
  var att    = parseInt(document.getElementById('f_att').value)||1;
  var notes  = document.getElementById('f_notes').value.trim();
  if (!agency||!owner||!phone) { alert('Please fill all required fields.'); return; }
  var venue = getVenue(venueId);
  var pax = slotPax(venueId, date, slotKey);
  if (pax+att > venue.capacity) { alert('Not enough capacity. Only '+(venue.capacity-pax)+' pax remaining.'); return; }
  // Duplicate check
  var dup = activeBookings().find(b=>b.agencyName.toLowerCase()===agency.toLowerCase());
  if (dup && !confirm('This agency already has a booking. Add another?')) return;

  var id = uid();
  var booking = { id, venueId, date, slotKey, agencyName:agency, ownerName:owner, phone, attendees:att, notes, bookedBy:CU.id, status:'confirmed', createdAt:new Date().toISOString() };
  db.ref('/bookings/'+id).set(booking).then(()=>{ showSaved(); closeModal(); }).catch(e=>alert('Error: '+e.message));
}

// ═══════════════════════════════════════════════════════════════════
// BOOKING DETAIL MODAL
// ═══════════════════════════════════════════════════════════════════
function viewBooking(id) {
  var b = CACHE.bookings[id];
  if (!b) return;
  var venue = getVenue(b.venueId);
  var slot = getSlots().find(s=>s.key===b.slotKey);
  var rep = getUser(b.bookedBy);
  var show = canSeeDetail(b);
  var canCancel = CU.role==='superadmin' && b.status!=='cancelled';
  var canAttend = CU.role!=='sales' && b.status==='confirmed';

  document.getElementById('modalTitle').textContent = 'Booking Details';
  var html = `<div class="alert alert-info">📅 ${fmtDate(b.date)} · ${slot?slot.label:'—'}</div>
    <div class="g2" style="margin-bottom:1rem">
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Venue</div><strong>${venue?venue.name:'—'}</strong></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Status</div><span class="badge badge-${b.status}">${b.status}</span></div>
    </div>`;

  if (show) {
    html += `<div class="g2" style="margin-bottom:1rem">
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Agency</div><strong style="font-size:15px">${b.agencyName}</strong></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Owner</div>${b.ownerName}</div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Phone</div><a href="tel:${b.phone}" style="color:var(--blue)">${b.phone}</a></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Attendees</div><strong>${b.attendees} pax</strong></div>
    </div>`;
    if (b.notes && CU.role!=='sales') html += `<div style="margin-bottom:1rem"><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Notes</div><div style="background:var(--lgold);padding:10px;border-radius:6px;font-size:13px">${b.notes}</div></div>`;
  } else {
    html += `<div class="alert alert-warn">🔒 Agency details are confidential — only your own bookings are visible.</div><div><strong>Attendees:</strong> ${b.attendees} pax</div>`;
  }
  html += `<div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);font-size:11px;color:var(--muted)">Booked by: ${rep?rep.name:'—'} · ${fmtDT(b.createdAt)}</div>`;
  document.getElementById('modalBody').innerHTML = html;

  var foot = '<button class="btn btn-outline" onclick="closeModal()">Close</button>';
  if (canAttend) {
    foot += `<button class="btn btn-green btn-sm" onclick="setStatus('${id}','attended')">✓ Attended</button>
             <button class="btn btn-outline btn-sm" style="border-color:var(--orange);color:var(--orange)" onclick="setStatus('${id}','noshow')">No-show</button>`;
  }
  if (canCancel) foot += `<button class="btn btn-red btn-sm" onclick="cancelBook('${id}')">Cancel Booking</button>`;
  document.getElementById('modalFoot').innerHTML = foot;
  document.getElementById('modal').style.display='flex';
}

function setStatus(id, status) {
  db.ref('/bookings/'+id+'/status').set(status).then(()=>{ showSaved(); closeModal(); }).catch(e=>alert(e.message));
}

function cancelBook(id) {
  if (!confirm('Cancel this booking? This cannot be undone.')) return;
  db.ref('/bookings/'+id).update({ status:'cancelled', cancelledAt:new Date().toISOString(), cancelledBy:CU.id })
    .then(()=>{ showSaved(); closeModal(); }).catch(e=>alert(e.message));
}

function closeModal() { document.getElementById('modal').style.display='none'; }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target===document.getElementById('modal')) closeModal(); });

// MY BOOKINGS
// ═══════════════════════════════════════════════════════════════════
function renderMyBookings() {
  var mine = allBookings().filter(b=>b.bookedBy===CU.id).sort((a,b)=>a.date>b.date?1:-1);
  var html = `<div class="page-header"><div class="ph-row">
    <div><div class="page-title">My Bookings</div>
    <div class="page-sub">${mine.filter(b=>b.status!=='cancelled').length} active</div></div>
    <div class="actions"><button class="btn btn-gold" onclick="navigate('calendar')">+ New Booking</button></div>
  </div></div>`;
  if (!mine.length) {
    html += `<div class="empty"><div class="ei">📋</div><p>No bookings yet</p><button class="btn btn-gold" style="margin-top:1rem" onclick="navigate('calendar')">Book a slot</button></div>`;
  } else {
    html += `<div class="card"><table class="tbl"><thead><tr><th>Date</th><th>Slot</th><th>Venue</th><th>Agency</th><th>Owner</th><th>Phone</th><th>Pax</th><th>Status</th><th></th></tr></thead><tbody>`;
    mine.forEach(b=>{
      var v=getVenue(b.venueId), s=getSlots().find(s=>s.key===b.slotKey);
      html += `<tr style="${b.status==='cancelled'?'opacity:.5':''}">
        <td>${fmtDate(b.date)}</td><td style="font-size:11px">${s?s.label:'—'}</td>
        <td style="font-size:11px">${v?v.name.split('–')[0].trim():'—'}</td>
        <td><strong>${b.agencyName}</strong></td><td>${b.ownerName}</td>
        <td><a href="tel:${b.phone}" style="color:var(--blue)">${b.phone}</a></td>
        <td>${b.attendees}</td><td><span class="badge badge-${b.status}">${b.status}</span></td>
        <td><button class="btn btn-outline btn-xs" onclick="viewBooking('${b.id}')">View</button></td>
      </tr>`;
    });
    html += '</tbody></table></div>';
  }
  document.getElementById('content').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════
// ALL BOOKINGS
// ═══════════════════════════════════════════════════════════════════
function renderAllBookings() {
  var all = allBookings().sort((a,b)=>a.date>b.date?1:-1);
  var html = `<div class="page-header"><div class="ph-row">
    <div><div class="page-title">All Bookings</div>
    <div class="page-sub">${all.filter(b=>b.status!=='cancelled').length} active · ${all.filter(b=>b.status==='cancelled').length} cancelled</div></div>
    <div class="actions">
      ${CU.role==='superadmin'?'<button class="btn btn-gold" onclick="exportCSV()">⬇ Export CSV</button>':''}
    </div>
  </div></div>
  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">`;
  ['all','confirmed','attended','noshow','cancelled'].forEach(s=>{
    var cnt = s==='all'?all.length:all.filter(b=>b.status===s).length;
    html += `<button class="btn btn-outline btn-sm" onclick="filterBk('${s}')">${s} (${cnt})</button>`;
  });
  html += `</div><div id="bkTable">${buildBkTable(all)}</div></div>`;
  document.getElementById('content').innerHTML = html;
}

function filterBk(status) {
  var all = allBookings().sort((a,b)=>a.date>b.date?1:-1);
  var f = status==='all'?all:all.filter(b=>b.status===status);
  document.getElementById('bkTable').innerHTML = buildBkTable(f);
}

function buildBkTable(bookings) {
  if (!bookings.length) return '<div class="empty"><div class="ei">📋</div><p>No bookings found</p></div>';
  var html = `<table class="tbl"><thead><tr><th>Date</th><th>Slot</th><th>Venue</th><th>Agency</th><th>Owner</th><th>Phone</th><th>Pax</th><th>Booked By</th><th>Status</th><th></th></tr></thead><tbody>`;
  bookings.forEach(b=>{
    var v=getVenue(b.venueId), s=getSlots().find(x=>x.key===b.slotKey), rep=getUser(b.bookedBy);
    html += `<tr style="${b.status==='cancelled'?'opacity:.5':''}">
      <td>${fmtDate(b.date)}</td><td style="font-size:11px">${s?s.label:'—'}</td>
      <td style="font-size:11px">${v?v.name.split('–')[0].trim():'—'}</td>
      <td><strong>${b.agencyName}</strong></td><td>${b.ownerName}</td>
      <td><a href="tel:${b.phone}" style="color:var(--blue)">${b.phone}</a></td>
      <td>${b.attendees}</td><td style="font-size:12px">${rep?rep.name:'—'}</td>
      <td><span class="badge badge-${b.status}">${b.status}</span></td>
      <td><button class="btn btn-outline btn-xs" onclick="viewBooking('${b.id}')">View</button></td>
    </tr>`;
  });
  return html + '</tbody></table>';
}

// ═══════════════════════════════════════════════════════════════════
// AGENCIES
// ═══════════════════════════════════════════════════════════════════
function renderAgencies() {
  var active = activeBookings();
  var map = {};
  active.forEach(b=>{
    if (!map[b.agencyName]) map[b.agencyName]={name:b.agencyName,owner:b.ownerName,phone:b.phone,bookings:[],pax:0};
    map[b.agencyName].bookings.push(b);
    map[b.agencyName].pax += parseInt(b.attendees||1);
  });
  var agencies = Object.values(map).sort((a,b)=>a.name.localeCompare(b.name));
  var html = `<div class="page-header"><div class="ph-row">
    <div><div class="page-title">🏢 Agencies</div>
    <div class="page-sub">${agencies.length} agencies registered</div></div>
    ${CU.role==='superadmin'?'<div class="actions"><button class="btn btn-gold" onclick="exportCSV()">⬇ Export CSV</button></div>':''}
  </div></div><div class="card">`;
  if (!agencies.length) {
    html += '<div class="empty"><div class="ei">🏢</div><p>No agencies booked yet</p></div>';
  } else {
    html += `<table class="tbl"><thead><tr><th>Agency</th><th>Owner</th><th>Phone</th><th>Bookings</th><th>Total Pax</th><th>Statuses</th></tr></thead><tbody>`;
    agencies.forEach(a=>{
      var statuses=[...new Set(a.bookings.map(b=>b.status))];
      html += `<tr><td><strong>${a.name}</strong></td><td>${a.owner}</td>
        <td><a href="tel:${a.phone}" style="color:var(--blue)">${a.phone}</a></td>
        <td>${a.bookings.length}</td><td>${a.pax}</td>
        <td>${statuses.map(s=>`<span class="badge badge-${s}">${s}</span>`).join(' ')}</td></tr>`;
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════
// USERS
// ═══════════════════════════════════════════════════════════════════
function renderUsers() {
  var html = `<div class="page-header"><div class="ph-row">
    <div><div class="page-title">👥 Users</div><div class="page-sub">${Object.keys(CACHE.users).length} users</div></div>
    <div class="actions"><button class="btn btn-gold" onclick="openAddUser()">+ Add User</button></div>
  </div></div><div class="card">
  <table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Bookings</th><th>Actions</th></tr></thead><tbody>`;
  Object.values(CACHE.users).forEach(u=>{
    var bks = activeBookings().filter(b=>b.bookedBy===u.id).length;
    var rc={sales:'var(--green)',admin:'var(--blue)',superadmin:'var(--gold)'};
    html += `<tr><td><strong>${u.name}</strong>${u.id===CU.id?' <span style="font-size:10px;color:var(--muted)">(you)</span>':''}</td>
      <td><code style="background:var(--lgold);padding:2px 6px;border-radius:4px;font-size:12px">${u.username}</code></td>
      <td><span style="font-weight:600;color:${rc[u.role]||'var(--text)'}">${u.role}</span></td>
      <td>${bks}</td>
      <td><button class="btn btn-outline btn-xs" onclick="editUser('${u.id}')">Edit</button>
      ${u.id!==CU.id?`<button class="btn btn-red btn-xs" style="margin-left:4px" onclick="deleteUser('${u.id}')">Remove</button>`:''}</td></tr>`;
  });
  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

function userForm(u) {
  u = u||{};
  return `<div class="fr2">
    <div class="fg"><label class="req">Full Name</label><input type="text" id="uf_name" value="${u.name||''}" placeholder="Full name"></div>
    <div class="fg"><label class="req">Username</label><input type="text" id="uf_username" value="${u.username||''}" placeholder="username"></div>
  </div><div class="fr2">
    <div class="fg"><label ${!u.id?'class="req"':''}>Password${u.id?' (blank = keep current)':''}</label>
      <input type="password" id="uf_pass" placeholder="${u.id?'Leave blank to keep':'Set password'}"></div>
    <div class="fg"><label class="req">Role</label><select id="uf_role">
      <option value="sales" ${u.role==='sales'?'selected':''}>Sales</option>
      <option value="admin" ${u.role==='admin'?'selected':''}>Admin</option>
      <option value="superadmin" ${u.role==='superadmin'?'selected':''}>Super Admin</option>
    </select></div>
  </div>`;
}

function openAddUser() {
  document.getElementById('modalTitle').textContent='Add User';
  document.getElementById('modalBody').innerHTML=userForm({});
  document.getElementById('modalFoot').innerHTML=`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveUser(null)">Add User</button>`;
  document.getElementById('modal').style.display='flex';
}
function editUser(id) {
  var u=CACHE.users[id];
  document.getElementById('modalTitle').textContent='Edit User';
  document.getElementById('modalBody').innerHTML=userForm(u);
  document.getElementById('modalFoot').innerHTML=`<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveUser('${id}')">Save</button>`;
  document.getElementById('modal').style.display='flex';
}
function saveUser(id) {
  var name=document.getElementById('uf_name').value.trim();
  var username=document.getElementById('uf_username').value.trim();
  var pass=document.getElementById('uf_pass').value;
  var role=document.getElementById('uf_role').value;
  if (!name||!username) { alert('Name and username required.'); return; }
  if (!id&&!pass) { alert('Password required for new users.'); return; }
  var dup=Object.values(CACHE.users).find(u=>u.username===username&&u.id!==id);
  if (dup) { alert('Username already taken.'); return; }
  if (id) {
    var upd={name,username,role};
    if (pass) upd.password=pass;
    db.ref('/users/'+id).update(upd).then(()=>{ showSaved(); closeModal(); }).catch(e=>alert(e.message));
  } else {
    var newId='u'+Date.now();
    db.ref('/users/'+newId).set({id:newId,username,password:pass,name,role}).then(()=>{ showSaved(); closeModal(); }).catch(e=>alert(e.message));
  }
}
function deleteUser(id) {
  var u=CACHE.users[id];
  if (!confirm(`Remove user "${u.name}"? Their bookings will remain.`)) return;
  db.ref('/users/'+id).remove().then(()=>showSaved()).catch(e=>alert(e.message));
}

// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
function renderConfig() {
  var c = CACHE.config;
  var slots = getSlots();
  var html = `<div class="page-header"><div class="ph-row">
    <div><div class="page-title">⚙️ Configuration</div></div>
    <div class="actions"><button class="btn btn-gold" onclick="saveConfig()">💾 Save Changes</button></div>
  </div></div>
  <div class="card" style="margin-bottom:1rem">
    <div class="cfg-title">Event Settings</div>
    <div class="cfg-grid">
      <div class="fg"><label>Event Name</label><input type="text" id="c_name" value="${c.eventName}"></div>
      <div class="fg"><label>Start Date</label><input type="date" id="c_start" value="${c.startDate}"></div>
      <div class="fg"><label>End Date</label><input type="date" id="c_end" value="${c.endDate}"></div>
    </div>
    <div class="cfg-grid">
      <div class="fg"><label>Slot Start Time</label><input type="time" id="c_slotstart" value="${c.slotStart}"></div>
      <div class="fg"><label>Slot End Time</label><input type="time" id="c_slotend" value="${c.slotEnd}"></div>
      <div class="fg"><label>Slot Duration (minutes)</label><input type="number" id="c_dur" value="${c.slotDuration}" min="15" max="240">
        <div class="hint">Current: ${c.slotDuration} min → ${slots.length} slots/day</div></div>
    </div>
  </div>
  <div class="card" style="margin-bottom:1rem">
    <div class="cfg-title">Venues</div>`;
  (c.venues||[]).forEach((v,i)=>{
    html += `<div class="venue-cfg"><div class="fr2">
      <div class="fg"><label>Venue Name</label><input type="text" id="v_name_${i}" value="${v.name}"></div>
      <div class="fg"><label>Capacity (pax)</label><input type="number" id="v_cap_${i}" value="${v.capacity}" min="1"></div>
    </div></div>`;
  });
  html += `<button class="btn btn-outline btn-sm" onclick="addVenue()">+ Add Venue</button></div>
  <div class="card">
    <div class="cfg-title">⚠️ Danger Zone</div>
    <button class="btn btn-red btn-sm" onclick="resetBookings()">Reset All Bookings</button>
    <div class="hint" style="margin-top:8px">Cannot be undone</div>
  </div>`;
  document.getElementById('content').innerHTML = html;
}

function saveConfig() {
  var c = CACHE.config;
  var newC = {
    eventName: document.getElementById('c_name').value,
    startDate: document.getElementById('c_start').value,
    endDate: document.getElementById('c_end').value,
    slotStart: document.getElementById('c_slotstart').value,
    slotEnd: document.getElementById('c_slotend').value,
    slotDuration: parseInt(document.getElementById('c_dur').value)||60,
    venues: (c.venues||[]).map((v,i)=>({
      id: v.id,
      name: document.getElementById('v_name_'+i).value,
      capacity: parseInt(document.getElementById('v_cap_'+i).value)||50
    }))
  };
  db.ref('/config').set(newC).then(()=>{ showSaved(); alert('Configuration saved.'); }).catch(e=>alert(e.message));
}

function addVenue() {
  var c = CACHE.config;
  var venues = [...(c.venues||[]), {id:'v'+Date.now(), name:'New Venue', capacity:50}];
  db.ref('/config/venues').set(venues).then(()=>{ showSaved(); renderConfig(); }).catch(e=>alert(e.message));
}

function resetBookings() {
  if (!confirm('Delete ALL bookings from the database? This cannot be undone.')) return;
  db.ref('/bookings').remove().then(()=>{ showSaved(); alert('All bookings deleted.'); navigate('dashboard'); }).catch(e=>alert(e.message));
}

// ═══════════════════════════════════════════════════════════════════
// CSV EXPORT (Super Admin only)
// ═══════════════════════════════════════════════════════════════════
function exportCSV() {
  if (CU.role!=='superadmin') { alert('Access denied.'); return; }
  var rows=[['ID','Date','Slot','Venue','Agency','Owner','Phone','Attendees','Booked By','Status','Notes','Created At']];
  allBookings().forEach(b=>{
    var v=getVenue(b.venueId), s=getSlots().find(x=>x.key===b.slotKey), rep=getUser(b.bookedBy);
    rows.push([b.id,b.date,s?s.label:'',v?v.name:'',b.agencyName,b.ownerName,b.phone,b.attendees,rep?rep.name:'',b.status,b.notes||'',fmtDT(b.createdAt)]);
  });
  var csv=rows.map(r=>r.map(v=>'"'+(v+'').replace(/"/g,'""')+'"').join(',')).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='vincitore_bookings_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
}
</script>
</body>
</html>
