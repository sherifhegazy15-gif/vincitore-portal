<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vincitore — Agency Briefing Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#B8973A;--dgold:#8A6E25;--lgold:#FDF6E3;--egold:#F5EDD0;
  --dark:#0C0B09;--dark2:#1C1912;--cream:#F5F0E8;
  --text:#1a1a1a;--muted:#666;--border:#e8e4d8;
  --green:#1E7E34;--red:#C0392B;--blue:#1A4D8A;--orange:#D97706;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
input,select,textarea,button{font-family:inherit}
/* AUTH */
#authScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--dark),var(--dark2))}
.auth-card{background:#fff;border-radius:16px;padding:2.5rem;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-logo{text-align:center;margin-bottom:1.75rem}
.auth-logo img{width:80px;height:80px;object-fit:contain;margin-bottom:10px}
.auth-logo h1{font-size:16px;font-weight:700;color:var(--dark);letter-spacing:.08em;margin-bottom:3px}
.auth-logo p{font-size:11px;color:var(--muted);letter-spacing:.06em}
.auth-error{background:#fff0f0;border:1px solid #fcc;color:var(--red);padding:8px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;display:none}
.form-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.form-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border .2s;margin-bottom:14px}
.form-input:focus{border-color:var(--gold)}
.auth-btn{width:100%;padding:12px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.auth-btn:hover{background:var(--dgold)}
.connecting{text-align:center;color:var(--muted);font-size:13px;padding:1rem}
/* LAYOUT */
#app{display:none;min-height:100vh;flex-direction:column}
.topbar{background:var(--dark);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-left img{height:38px;object-fit:contain}
.topbar-divider{color:#444;font-size:18px}
.topbar-title{font-size:13px;color:#aaa}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-user{font-size:12px;color:#ccc}
.role-badge{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:10px;background:rgba(184,151,58,.2);color:var(--gold)}
.topbar-btn{background:none;border:1px solid #444;color:#aaa;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:all .2s}
.topbar-btn:hover{border-color:#888;color:#fff}
.event-switcher{background:rgba(184,151,58,.15);border:1px solid var(--gold);color:var(--gold);padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;max-width:200px}
.save-ind{font-size:11px;color:#4caf7d;opacity:0;transition:opacity .5s}
.main{display:flex;flex:1;min-height:calc(100vh - 56px)}
/* SIDEBAR */
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);padding:1rem 0;flex-shrink:0;overflow-y:auto}
.nav-sep{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:12px 20px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;margin:1px 8px;border-radius:8px}
.nav-item:hover{background:var(--lgold);color:var(--dgold)}
.nav-item.active{background:var(--egold);color:var(--dgold);font-weight:600}
.content{flex:1;padding:1.5rem;overflow-y:auto;background:var(--cream)}
/* COMPONENTS */
.page-header{margin-bottom:1.5rem}
.ph-row{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.page-title{font-size:22px;font-weight:600;color:var(--dark)}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:13px;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border-radius:10px;border:1px solid var(--border);padding:1.25rem;text-align:center}
.stat-n{font-size:32px;font-weight:700;color:var(--gold);line-height:1}
.stat-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--dgold)}
.btn-outline{background:#fff;color:var(--dgold);border:1.5px solid var(--gold)}.btn-outline:hover{background:var(--lgold)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#a02020}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:#153d70}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;text-transform:uppercase}
.badge-confirmed{background:#e8f5e9;color:var(--green)}
.badge-attended{background:#e3f2fd;color:var(--blue)}
.badge-noshow{background:#fce4ec;color:var(--red)}
.badge-cancelled{background:#f5f5f5;color:#999}
/* CALENDAR */
.venue-tabs{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.venue-tab{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);color:var(--muted);background:#fff;transition:all .15s}
.venue-tab.active{border-color:var(--gold);background:var(--egold);color:var(--dgold);font-weight:600}
.cal-wrap{overflow-x:auto}
.cal-tbl{border-collapse:collapse;min-width:100%;font-size:12px}
.cal-tbl th{background:var(--dark);color:#fff;padding:10px 8px;text-align:center;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid #333;min-width:145px}
.cal-tbl th.slot-th{background:var(--dgold);min-width:125px}
.cal-tbl td{border:1px solid var(--border);padding:4px;vertical-align:top}
.slot-lbl{padding:9px 8px;font-size:11px;font-weight:600;color:var(--dgold);text-align:center;white-space:nowrap;background:var(--egold)}
.sc{min-height:85px;padding:5px;border-radius:4px;transition:background .15s}
.sc-avail{background:#fff;cursor:pointer}.sc-avail:hover{background:var(--lgold)}
.sc-mine{background:#e8f5e9;cursor:pointer}.sc-mine:hover{background:#d4edda}
.sc-other{background:#fff8f8}
.sc-full{background:#f9f9f9}
.sc-status{font-size:10px;font-weight:600;margin-bottom:4px}
.bk-chip{border-radius:4px;padding:4px 6px;margin:2px 0;font-size:10px;line-height:1.4;cursor:pointer;display:block}
.bk-chip-mine{background:#c8e6c9;border:1px solid #a5d6a7;color:#1b5e20}
.bk-chip-other{background:var(--lgold);border:1px solid #e8d9a0;color:var(--dgold)}
.bk-chip-masked{background:#f5f5f5;border:1px solid #e0e0e0;color:#aaa;cursor:default}
.add-btn{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--gold);border-radius:5px;padding:6px;color:var(--gold);font-size:11px;cursor:pointer;margin-top:3px;transition:all .15s;font-weight:500}
.add-btn:hover{background:var(--lgold)}
.pax-bar{height:3px;background:#e0e0e0;border-radius:2px;margin-top:4px;overflow:hidden}
.pax-fill{height:100%;border-radius:2px;transition:width .3s}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:#fff;border-radius:12px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-hdr{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:16px;font-weight:600}
.modal-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal-body{padding:1.5rem}
.modal-foot{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:5px}
.fg label.req::after{content:" *";color:var(--red)}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;transition:border .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg textarea{resize:vertical;min-height:70px}
.fg .hint{font-size:11px;color:var(--muted);margin-top:3px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:1rem;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.alert-info{background:#e3f2fd;border:1px solid #bbdefb;color:var(--blue)}
.alert-warn{background:#fff8e1;border:1px solid #ffe082;color:var(--orange)}
.alert-ok{background:#e8f5e9;border:1px solid #c8e6c9;color:var(--green)}
/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--border);background:var(--lgold)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--lgold)}
/* PERMS */
.perm-tbl{width:100%;border-collapse:collapse;font-size:12px}
.perm-tbl th{padding:8px 10px;background:var(--dark);color:#fff;font-size:11px;font-weight:600;text-align:center;border:1px solid #333}
.perm-tbl th:first-child{text-align:left;background:var(--dgold)}
.perm-tbl td{padding:8px 10px;border:1px solid var(--border);text-align:center;vertical-align:middle}
.perm-tbl td:first-child{text-align:left;font-weight:500;background:var(--lgold)}
.perm-tbl tr:hover td{background:#faf7f0}
.perm-tbl tr:hover td:first-child{background:var(--egold)}
.tog{position:relative;display:inline-block;width:40px;height:22px}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:22px;transition:.2s}
.tog-sl:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+.tog-sl{background:var(--gold)}
.tog input:checked+.tog-sl:before{transform:translateX(18px)}
.tog input:disabled+.tog-sl{opacity:.5;cursor:not-allowed}
/* CONFIG */
.cfg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-bottom:1rem}
.venue-cfg{border:1px solid var(--border);border-radius:8px;padding:1rem;background:var(--lgold);margin-bottom:.75rem;display:flex;gap:1rem;align-items:flex-end}
.venue-cfg .fg{margin-bottom:0;flex:1}
/* ROLES */
.role-card{border:1px solid var(--border);border-radius:8px;padding:1rem;background:#fff;margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center}
.role-card.is-system{border-color:var(--gold);background:var(--lgold)}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty .ei{font-size:40px;margin-bottom:.75rem}
.empty p{font-size:14px}
/* PHONE INPUT */
.phone-wrap{display:flex;gap:0;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;transition:border .2s}
.phone-wrap:focus-within{border-color:var(--gold)}
.phone-cc{padding:9px 10px;background:var(--egold);border-right:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--dgold);white-space:nowrap;flex-shrink:0}
.phone-num{border:none!important;border-radius:0!important;flex:1;outline:none;padding:9px 12px;font-size:13px}
.phone-err{font-size:11px;color:var(--red);margin-top:3px;display:none}
/* MOBILE HAMBURGER */
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:4px;flex-direction:column;gap:5px}
.hamburger span{display:block;width:22px;height:2px;background:#ccc;border-radius:2px;transition:all .2s}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
/* MOBILE BREAKPOINTS */
@media(max-width:768px){
  /* Auth */
  .auth-card{width:calc(100vw - 2rem);padding:2rem 1.5rem}
  /* Topbar */
  .topbar{padding:0 1rem}
  .topbar-divider,.topbar-title,.topbar-user,.event-switcher{display:none}
  .hamburger{display:flex}
  .save-ind{display:none}
  /* Sidebar — slide in */
  .sidebar{position:fixed;left:-240px;top:56px;height:calc(100vh - 56px);z-index:100;transition:left .25s;box-shadow:4px 0 20px rgba(0,0,0,.15);width:240px}
  .sidebar.open{left:0}
  .sidebar-overlay.open{display:block}
  /* Content */
  .content{padding:1rem}
  /* Grids */
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .g4{grid-template-columns:1fr 1fr}
  .fr2{grid-template-columns:1fr}
  .cfg-grid{grid-template-columns:1fr}
  /* Page header */
  .ph-row{flex-direction:column;gap:10px}
  .actions{width:100%}
  .actions .btn{flex:1;justify-content:center}
  /* Tables — scroll */
  .card{overflow-x:auto;padding:1rem}
  .tbl,.perm-tbl,.cal-tbl{min-width:520px}
  /* Stats */
  .stat-n{font-size:24px}
  /* Modal */
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-height:85vh;max-width:100%}
  /* Venue tabs */
  .venue-tab{font-size:12px;padding:6px 10px}
  /* Role cards */
  .role-card{flex-direction:column;align-items:flex-start;gap:8px}
  .role-card > div:last-child{width:100%;display:flex;gap:6px}
  .role-card > div:last-child .btn{flex:1;justify-content:center}
  /* Venue config */
  .venue-cfg{flex-direction:column}
  .venue-cfg .fg{width:100%}
  /* Modal foot */
  .modal-foot{flex-direction:column-reverse}
  .modal-foot .btn{width:100%;justify-content:center}
}
@media(max-width:400px){
  .g2,.g4{grid-template-columns:1fr}
  .page-title{font-size:18px}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <img id="authLogo" alt="Vincitore">
      <h1>VINCITORE REALTY</h1>
      <p>AGENCY BRIEFING PORTAL</p>
    </div>
    <div id="connectingMsg" class="connecting">⏳ Connecting to database…</div>
    <div id="loginForm" style="display:none">
      <div class="auth-error" id="authError">Invalid username or password</div>
      <label class="form-label">Username</label>
      <input class="form-input" type="text" id="loginUser" placeholder="Username" autocomplete="username">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="loginPass" placeholder="Password">
      <button class="auth-btn" onclick="doLogin()">Sign In</button>
    </div>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <img id="topbarLogo" alt="Vincitore">
      <span class="topbar-divider">|</span>
      <span class="topbar-title" id="topbarEventName">Agency Briefing Portal</span>
    </div>
    <div class="topbar-right">
      <span class="save-ind" id="saveInd">✓ Saved</span>
      <select class="event-switcher" id="eventSwitcher" onchange="switchEvent(this.value)" style="display:none" title="Switch event"></select>
      <span class="topbar-user" id="topbarUser"></span>
      <span class="role-badge" id="topbarRole"></span>
      <button class="topbar-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"><div class="connecting">Loading…</div></div>
  </div>
</div>
<div class="modal-overlay" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modalTitle"></span>
      <button class="modal-x" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

// ── Init & Migration ──────────────────────────────────────────────
async function init(){
  // Connection timeout — if Firebase doesn't respond in 8 seconds show error
  var connTimeout=setTimeout(function(){
    if(document.getElementById('loginForm').style.display==='none'&&document.getElementById('connectingMsg').style.display!=='none'){
      document.getElementById('connectingMsg').innerHTML='❌ Connection is taking too long.<br><small>Check your internet and <a href="" style="color:var(--gold)">refresh the page</a>.</small>';
    }
  },8000);

  try{
    // Read only what we need — NOT the whole DB
    await new Promise(r=>setTimeout(r,500));

    var usersSnap   = await DB.ref('/users').once('value');
    var eventsSnap  = await DB.ref('/events').once('value');
    var oldCfgSnap  = await DB.ref('/config').once('value');
    var rolesSnap   = await DB.ref('/roles').once('value');

    var hasUsers     = usersSnap.exists();
    var hasEvents    = eventsSnap.exists();
    var hasOldConfig = oldCfgSnap.exists();
    var hasRoles     = rolesSnap.exists();

    // Seed roles only if completely missing
    if(!hasRoles){
      await DB.ref('/roles').set(DEFAULT_ROLES);
    }else{
      // Add new roles if missing (art_director, videographer)
      var existingRoles=rolesSnap.val()||{};
      var updates={};
      if(!existingRoles.art_director) updates['/roles/art_director']=DEFAULT_ROLES.art_director;
      if(!existingRoles.videographer)  updates['/roles/videographer']=DEFAULT_ROLES.videographer;
      if(Object.keys(updates).length) await DB.ref().update(updates);
    }

    // Migrate v1 → v2 only if old config exists AND no events yet
    if(hasOldConfig&&!hasEvents){
      var c=oldCfgSnap.val();
      var bks=(await DB.ref('/bookings').once('value')).val()||{};
      var eid='event_'+Date.now();
      var migratedCfg={...DEFAULT_EVENT_CFG,
        name:c.eventName||DEFAULT_EVENT_CFG.name,
        startDate:c.startDate||DEFAULT_EVENT_CFG.startDate,
        endDate:c.endDate||DEFAULT_EVENT_CFG.endDate,
        slotStart:c.slotStart||DEFAULT_EVENT_CFG.slotStart,
        slotEnd:c.slotEnd||DEFAULT_EVENT_CFG.slotEnd,
        slotDuration:c.slotDuration||60,
        venues:c.venues||DEFAULT_EVENT_CFG.venues
      };
      await DB.ref('/events/'+eid+'/config').set(migratedCfg);
      if(Object.keys(bks).length) await DB.ref('/events/'+eid+'/bookings').set(bks);
      await DB.ref('/events_meta/'+eid).set({name:migratedCfg.name,createdAt:new Date().toISOString()});
      await DB.ref('/active_event').set(eid);
      await DB.ref('/config').remove();
      await DB.ref('/bookings').remove();
    }

    // Create first event only if NO events exist AND no old config
    if(!hasEvents&&!hasOldConfig){
      var eid2='event_'+Date.now();
      await DB.ref('/events/'+eid2+'/config').set(DEFAULT_EVENT_CFG);
      await DB.ref('/events_meta/'+eid2).set({name:DEFAULT_EVENT_CFG.name,createdAt:new Date().toISOString()});
      await DB.ref('/active_event').set(eid2);
    }

    // Seed default users only if completely absent
    if(!hasUsers){
      var defUsers={
        u1:{id:'u1',username:'superadmin',password:'Vincitore@2026',name:'Super Admin',role:'superadmin'},
        u2:{id:'u2',username:'admin',password:'Admin@2026',name:'Admin',role:'admin'},
        u3:{id:'u3',username:'sales1',password:'Sales@2026',name:'Sales Rep 1',role:'sales'},
      };
      await DB.ref('/users').set(defUsers);
    }

    startListeners();
    clearTimeout(connTimeout);
    document.getElementById('connectingMsg').style.display='none';

    // Restore session on refresh
    setTimeout(function(){
      var savedId=localStorage.getItem('vp_session');
      if(savedId&&CACHE.users[savedId]){
        var user=CACHE.users[savedId];
        CU=user;
        document.getElementById('authScreen').style.display='none';
        document.getElementById('app').style.cssText='display:flex;flex-direction:column';
        document.getElementById('topbarUser').textContent=user.name;
        document.getElementById('topbarRole').textContent=(roles()[user.role]||{}).label||user.role;
        buildSidebar();buildEventSwitcher();navigate(getDefaultPage());
      }else{
        document.getElementById('loginForm').style.display='block';
      }
    },800);

  }catch(e){
    clearTimeout(connTimeout);
    document.getElementById('connectingMsg').innerHTML='❌ Error: '+e.message+'<br><small><a href="" style="color:var(--gold)">Refresh to try again</a></small>';
    console.error('Init error:', e);
  }
}

function startListeners(){
  DB.ref('/users').on('value',s=>{CACHE.users=s.val()||{};if(CU)rerender();});
  DB.ref('/video_bookings').on('value',s=>{CACHE.videoBookings=s.exists()?s.val():{};if(CU&&PAGE==='videoshoots')renderVideoShoots();});
  DB.ref('/events_meta').on('value',s=>{CACHE.eventsMeta=s.val()||{};if(CU)buildEventSwitcher();});
  DB.ref('/roles').on('value',s=>{CACHE.roles=s.val()||DEFAULT_ROLES;if(CU)rerender();});
  DB.ref('/active_event').on('value',s=>{
    ACTIVE_EID=s.val();
    DB.ref('/events/'+ACTIVE_EID+'/config').on('value',c=>{
      CACHE.cfg=c.val();
      if(CU){
        var n=CACHE.cfg?CACHE.cfg.name:'Portal';
        document.getElementById('topbarEventName').textContent=n;
        buildEventSwitcher();rerender();
      }
    });
    DB.ref('/events/'+ACTIVE_EID+'/bookings').on('value',b=>{CACHE.bookings=b.val()||{};if(CU)rerender();});
  });
}

init();

// ── Helpers ───────────────────────────────────────────────────────
function uid(){return'b'+Date.now()+Math.random().toString(36).substr(2,5);}
function pad(n){return n<10?'0'+n:''+n;}
function cfg(){return CACHE.cfg||{};}
function roles(){return CACHE.roles||DEFAULT_ROLES;}
function myRole(){if(!CU)return{};return roles()[CU.role]||{label:CU.role,perms:{}};}
function can(perm){if(!CU)return false;return !!(myRole().perms||{})[perm];}

function getDays(){
  if(!cfg().startDate)return[];
  var days=[],d=new Date(cfg().startDate+'T00:00:00');
  var end=new Date(cfg().endDate+'T00:00:00');
  while(d<=end){
    var y=d.getFullYear(),mo=d.getMonth()+1,dy=d.getDate();
    days.push(y+'-'+pad(mo)+'-'+pad(dy));d.setDate(d.getDate()+1);
  }
  return days;
}
function getSlots(){
  if(!cfg().slotStart)return[];
  var slots=[];
  var[sh,sm]=cfg().slotStart.split(':').map(Number);
  var[eh,em]=cfg().slotEnd.split(':').map(Number);
  var cur=sh*60+sm,endM=eh*60+em,dur=parseInt(cfg().slotDuration)||60;
  while(cur+dur<=endM){
    var h1=Math.floor(cur/60),m1=cur%60,h2=Math.floor((cur+dur)/60),m2=(cur+dur)%60;
    var f=h=>h%12===0?12:h%12,a=h=>h<12?'AM':'PM';
    slots.push({key:pad(h1)+':'+pad(m1),label:f(h1)+':'+pad(m1)+a(h1)+' – '+f(h2)+':'+pad(m2)+a(h2)});
    cur+=dur;
  }
  return slots;
}
function fmtDate(s){return new Date(s+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function fmtDT(s){if(!s)return'—';var d=new Date(s);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function getVenue(id){return(cfg().venues||[]).find(v=>v.id===id);}
function getUser(id){return CACHE.users[id];}
function allBk(){return Object.values(CACHE.bookings);}
function activeBk(){return allBk().filter(b=>b.status!=='cancelled');}
function slotBk(vid,date,sk){return activeBk().filter(b=>b.venueId===vid&&b.date===date&&b.slotKey===sk);}
// Who owns a slot (first booker's userId, or null)
function slotOwner(vid,date,sk){var bks=slotBk(vid,date,sk);return bks.length?bks[0].bookedBy:null;}
function slotPax(vid,date,sk){return slotBk(vid,date,sk).reduce((s,b)=>s+parseInt(b.attendees||1),0);}
function showSaved(){var el=document.getElementById('saveInd');if(el){el.style.opacity='1';setTimeout(()=>el.style.opacity='0',1500);}}
function rerender(){var p={dashboard:renderDashboard,calendar:renderCalendar,mybookings:renderMyBookings,allbookings:renderAllBookings,agencies:renderAgencies,users:renderUsers,roles:renderRoles,events:renderEvents,config:renderConfig,videoshoots:renderVideoShoots};if(p[PAGE])p[PAGE]();}

function getDefaultPage(){
  if(CU.role==='art_director'||CU.role==='videographer') return 'videoshoots';
  return 'dashboard';
}

// ── Auth ──────────────────────────────────────────────────────────
function doLogin(){
  var u=document.getElementById('loginUser').value.trim();
  var p=document.getElementById('loginPass').value;
  var user=Object.values(CACHE.users).find(x=>x.username===u&&x.password===p);
  if(!user){document.getElementById('authError').style.display='block';return;}
  document.getElementById('authError').style.display='none';
  CU=user;
  localStorage.setItem('vp_session', user.id);
  document.getElementById('authScreen').style.display='none';
  document.getElementById('app').style.cssText='display:flex;flex-direction:column';
  document.getElementById('topbarUser').textContent=user.name;
  document.getElementById('topbarRole').textContent=(roles()[user.role]||{}).label||user.role;
  buildSidebar();buildEventSwitcher();navigate('dashboard');
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('loginForm').style.display!=='none')doLogin();});
function doLogout(){CU=null;localStorage.removeItem('vp_session');document.getElementById('app').style.display='none';document.getElementById('authScreen').style.display='flex';document.getElementById('loginPass').value='';document.getElementById('loginUser').value='';}

// ── Event switcher ─────────────────────────────────────────────────
function buildEventSwitcher(){
  if(!CU||!can('canManageEvents'))return;
  var sel=document.getElementById('eventSwitcher');
  sel.style.display='block';sel.innerHTML='';
  Object.entries(CACHE.eventsMeta).forEach(([eid,meta])=>{
    var o=document.createElement('option');
    o.value=eid;o.textContent=meta.name;
    if(eid===ACTIVE_EID)o.selected=true;
    sel.appendChild(o);
  });
}
function switchEvent(eid){if(eid!==ACTIVE_EID)DB.ref('/active_event').set(eid);}

// ── Nav ───────────────────────────────────────────────────────────

  var isCreative=CU.role==='art_director'||CU.role==='videographer';

    {id:'agencies',    icon:'🏢',label:'Agencies',          show:!isCreative&&can('canViewOthers')},
    {id:'users',       icon:'👥',label:'Users',             show:can('canManageUsers')},
    {id:'roles',       icon:'🔐',label:'Roles & Access',    show:can('canManageRoles')},
    {id:'events',      icon:'🗓',label:'Events',            show:can('canManageEvents')},

// ── Sidebar toggle (mobile) ───────────────────────────────────────
function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('sidebarOverlay');
  sb.classList.toggle('open');
  ov.classList.toggle('open');
}
// Close sidebar on nav click (mobile)
function navigate(page){
  PAGE=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  var nav=document.getElementById('nav-'+page);if(nav)nav.classList.add('active');
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  rerender();
}

    <div><div class="page-title">Dashboard</div>
    <div class="page-sub">${cfg().name||'—'} · ${fmtDate(cfg().startDate||'')} – ${fmtDate(cfg().endDate||'')}</div></div>
    <div class="actions">${can('canBook')?'<button class="btn btn-gold" onclick="navigate(\'calendar\')">📅 Book a Slot</button>':''}</div>
  </div></div>`;

  if(!can('canViewOthers')){
    html+=`<div class="g4" style="margin-bottom:1.25rem">
      <div class="stat"><div class="stat-n">${mine.length}</div><div class="stat-l">My Bookings</div></div>
      <div class="stat"><div class="stat-n">${mine.reduce((s,b)=>s+parseInt(b.attendees||1),0)}</div><div class="stat-l">My Pax</div></div>
      <div class="stat"><div class="stat-n">${mine.filter(b=>b.status==='attended').length}</div><div class="stat-l">Attended</div></div>
      <div class="stat"><div class="stat-n">${mine.filter(b=>b.status==='confirmed').length}</div><div class="stat-l">Upcoming</div></div>
    </div>`;
  }else{
    var totalPax=active.reduce((s,b)=>s+parseInt(b.attendees||1),0);
    html+=`<div class="g4" style="margin-bottom:1.25rem">
      <div class="stat"><div class="stat-n">${active.length}</div><div class="stat-l">Total Bookings</div></div>
      <div class="stat"><div class="stat-n">${totalPax}</div><div class="stat-l">Total Pax</div></div>
      <div class="stat"><div class="stat-n">${active.filter(b=>b.status==='attended').length}</div><div class="stat-l">Attended</div></div>
      <div class="stat"><div class="stat-n">${[...new Set(active.map(b=>b.agencyName))].length}</div><div class="stat-l">Agencies</div></div>
    </div>`;
  }

  html+='<div class="g2" style="margin-bottom:1.25rem">';

    var pct=totalSlots>0?Math.round(claimedSlots/totalSlots*100):0;
    var fillC=pct>80?'#ef9a9a':pct>50?'#ffe082':'#B8973A';
    html+=`<div class="card">
      <div class="card-title">🏢 ${v.name}</div>
      <div style="font-size:22px;font-weight:700;color:var(--gold);margin-bottom:4px">${claimedSlots} / ${totalSlots} slots claimed</div>
      <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:6px 0">
        <div style="height:100%;width:${pct}%;background:${fillC};border-radius:4px"></div>
      </div>
      <div style="font-size:11px;color:var(--muted)">${pct}% utilised · ${vb.reduce((s,b)=>s+parseInt(b.attendees||1),0)} total pax · ${v.capacity} pax/slot</div>
    </div>`;
  });
  html+='</div>';

  var upcoming=(can('canViewOthers')?active:mine).filter(b=>b.status==='confirmed').slice(0,6);
  html+=`<div class="card"><div class="card-title">📋 Upcoming Bookings
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-left:auto">
      <select id="db_filter_date" onchange="applyDashFilters()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <option value="">All dates</option>
        ${getDays().map(d=>`<option value="${d}">${fmtDate(d)}</option>`).join('')}
      </select>
      <select id="db_filter_venue" onchange="applyDashFilters()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <option value="">All venues</option>
        ${(cfg().venues||[]).map(v=>`<option value="${v.id}">${v.name.split('–')[0].trim()}</option>`).join('')}
      </select>
      <select id="db_filter_slot" onchange="applyDashFilters()" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <option value="">All slots</option>
        ${getSlots().map(s=>`<option value="${s.key}">${s.label}</option>`).join('')}
      </select>
    </div>
  </div>
  <div id="dashBkTable">${buildDashBkTable(upcoming)}</div>
  </div>`;
  if(can('canViewOthers')){
    html+=`<div class="card" style="margin-top:1rem"><div class="card-title">👥 Rep Performance</div>
      <table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Bookings</th><th>Pax</th><th>Attended</th><th>No-show</th></tr></thead><tbody>`;
    Object.values(CACHE.users).filter(u=>u.id!==CU.id).forEach(u=>{
      var ub=active.filter(b=>b.bookedBy===u.id);
      if(!ub.length)return;
      html+=`<tr><td><strong>${u.name}</strong></td>
        <td style="font-size:11px;color:var(--muted)">${(roles()[u.role]||{}).label||u.role}</td>
        <td>${ub.length}</td><td>${ub.reduce((s,b)=>s+parseInt(b.attendees||1),0)}</td>
        <td>${ub.filter(b=>b.status==='attended').length}</td>
        <td>${ub.filter(b=>b.status==='noshow').length}</td></tr>`;
    });
    html+='</tbody></table></div>';

function buildDashBkTable(bks){
  if(!bks.length) return'<div class="empty"><div class="ei">📅</div><p>No bookings match the selected filters</p></div>';
  var html=`<table class="tbl"><thead><tr><th>Date</th><th>Slot</th><th>Venue</th><th>Agency</th>${can('canViewOthers')?'<th>Booked By</th>':''}<th>Registered</th><th>Attended</th><th></th></tr></thead><tbody>`;
  bks.forEach(b=>{
    var v=getVenue(b.venueId),s=getSlots().find(x=>x.key===b.slotKey),rep=getUser(b.bookedBy);
    html+=`<tr>
      <td>${fmtDate(b.date)}</td>
      <td style="font-size:11px">${s?s.label:'—'}</td>
      <td style="font-size:11px">${v?v.name.split('–')[0].trim():'—'}</td>
      <td><strong>${b.agencyName}</strong></td>
      ${can('canViewOthers')?`<td style="font-size:12px">${rep?rep.name:'—'}</td>`:''}
      <td>${b.attendees}</td>
      <td>${b.status==='attended'&&b.paxAttended!==undefined?`<span style="color:var(--green);font-weight:600">${b.paxAttended}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
      <td><button class="btn btn-outline btn-xs" onclick="viewBk('${b.id}')">View</button></td>
    </tr>`;
  });
  return html+'</tbody></table>';
}

function applyDashFilters(){
  var dateF=document.getElementById('db_filter_date')?document.getElementById('db_filter_date').value:'';
  var venueF=document.getElementById('db_filter_venue')?document.getElementById('db_filter_venue').value:'';
  var slotF=document.getElementById('db_filter_slot')?document.getElementById('db_filter_slot').value:'';
  var active=activeBk();
  var base=can('canViewOthers')?active:active.filter(b=>b.bookedBy===CU.id);
  var filtered=base.filter(b=>{
    if(dateF&&b.date!==dateF) return false;
    if(venueF&&b.venueId!==venueF) return false;
    if(slotF&&b.slotKey!==slotF) return false;
    return true;
  }).sort((a,b)=>a.date>b.date?1:-1);
  var el=document.getElementById('dashBkTable');
  if(el) el.innerHTML=buildDashBkTable(filtered);
}

// ── Calendar ──────────────────────────────────────────────────────
function renderCalendar(){
  var days=getDays(),slots=getSlots(),venues=cfg().venues||[];
  if(!venues.length){document.getElementById('content').innerHTML='<div class="empty"><div class="ei">⚙️</div><p>No venues configured</p></div>';return;}
  var venue=venues[VENUE_IDX]||venues[0];

  var html=`<div class="page-header"><div class="ph-row">
    <div><div class="page-title">📅 Booking Calendar</div>
    <div class="page-sub">Each slot is exclusive to one sales rep · ${days.length} days · ${slots.length} slots/day · ${venue.capacity} pax/slot</div></div>
  </div></div>
  <div class="venue-tabs">`;
  venues.forEach((v,i)=>{
    var cn=[...new Set(activeBk().filter(b=>b.venueId===v.id).map(b=>b.date+'|'+b.slotKey))].length;
    html+=`<div class="venue-tab${VENUE_IDX===i?' active':''}" onclick="switchVenue(${i})">🏢 ${v.name} <span style="font-size:11px;color:var(--muted)">${cn} slots claimed</span></div>`;
  });
  html+=`</div>
  <div style="display:flex;gap:14px;margin-bottom:1rem;font-size:12px;flex-wrap:wrap">
    <span style="color:var(--green)">🟢 Available</span>
    <span style="color:var(--blue)">🟦 Your slot</span>
    <span style="color:var(--red)">🔴 Taken by another rep</span>
    <span style="color:var(--orange)">🟡 Full (50 pax)</span>
  </div>
  <div class="cal-wrap"><table class="cal-tbl"><thead><tr><th class="slot-th">Time Slot</th>`;
  days.forEach(d=>{html+=`<th>${fmtDate(d)}</th>`;});
  html+='</tr></thead><tbody>';

  slots.forEach(slot=>{
    html+=`<tr><td><div class="slot-lbl">${slot.label}</div></td>`;
    days.forEach(date=>{
      var bks=slotBk(venue.id,date,slot.key);
      var owner=slotOwner(venue.id,date,slot.key);
      var isMine=owner===CU.id;
      var isOther=owner&&owner!==CU.id;
      var isEmpty=!owner;
      var pax=slotPax(venue.id,date,slot.key);
      var cap=venue.capacity;
      var isFull=pax>=cap;
      var pct=Math.min(100,Math.round(pax/cap*100));
      var fillC=isFull?'#ef9a9a':pct>60?'#ffe082':'#a5d6a7';

      html+=`<td>`;
      if(isEmpty&&can('canBook')){
        // Available
        html+=`<div class="sc sc-avail" onclick="openBook('${venue.id}','${date}','${slot.key}')">
          <div class="sc-status" style="color:var(--green)">🟢 Available</div>
          <div class="add-btn">+ Book this slot</div>
        </div>`;
      }else if(isMine){
        // My slot — show all my bookings + option to add more if not full
        var myBks=bks.filter(b=>b.bookedBy===CU.id);
        html+=`<div class="sc sc-mine">
          <div class="sc-status" style="color:var(--blue)">${isFull?'🟡 Your slot (full)':'🟦 Your slot'}</div>`;
        myBks.forEach(b=>{
          html+=`<div class="bk-chip bk-chip-mine" onclick="viewBk('${b.id}')">🏢 ${b.agencyName.length>16?b.agencyName.substring(0,15)+'…':b.agencyName} (${b.attendees})</div>`;
        });
        if(!isFull&&can('canAddToOwnSlot')){
          html+=`<div class="add-btn" onclick="openAddToSlot('${venue.id}','${date}','${slot.key}')">+ Add agency</div>`;
        }        html+=`<div class="pax-bar"><div class="pax-fill" style="width:${pct}%;background:${fillC}"></div></div>`;
        html+=`<div style="font-size:10px;color:var(--muted);margin-top:2px">${pax}/${cap} pax</div>`;
        html+='</div>';
      }else if(isOther){
        // Taken by another rep
        var ownerUser=getUser(owner);
        html+=`<div class="sc sc-other" ${can('canViewOthers')?`onclick="viewBk('${bks[0].id}')"`:''}>
          <div class="sc-status" style="color:var(--red)">🔴 Slot taken</div>`;
        if(can('canViewOthers')){
          bks.forEach(b=>{
            html+=`<div class="bk-chip bk-chip-other" onclick="event.stopPropagation();viewBk('${b.id}')">🏢 ${b.agencyName.length>16?b.agencyName.substring(0,15)+'…':b.agencyName} (${b.attendees})</div>`;
          });
          html+=`<div style="font-size:10px;color:var(--muted);margin-top:3px">By: ${ownerUser?ownerUser.name:'—'} · ${pax}/${cap} pax</div>`;
          if(!isFull&&can('canAddToOwnSlot')){
            html+=`<div class="add-btn" onclick="event.stopPropagation();openAddToSlot('${venue.id}','${date}','${slot.key}')">+ Add agency for ${ownerUser?ownerUser.name:'rep'}</div>`;
          }
        }else{
          html+=`<div class="bk-chip bk-chip-masked">${pax} pax booked</div>`;
        }
        html+='</div>';
      }else{
        html+=`<div class="sc sc-full"><div class="sc-status" style="color:var(--muted)">—</div></div>`;
      }
      html+=`</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  document.getElementById('content').innerHTML=html;
}

// ── Book modal (first booking on a slot) ──────────────────────────
// ── Phone validation ──────────────────────────────────────────────
// Accepts: +[country_code]-[number]  e.g. +971-509082142
// Rules: country code 1-3 digits, number 5-12 digits, digits only in each part
function phoneHTML(){
  return `<div class="fg">
    <label class="req">Phone Number</label>
    <div class="phone-wrap">
      <span class="phone-cc">+</span>
      <input type="text" id="f_cc" placeholder="971" maxlength="4"
        style="width:64px;border:none;background:var(--egold);font-weight:600;color:var(--dgold);padding:9px 6px;outline:none;text-align:center"
        oninput="this.value=this.value.replace(/[^0-9]/g,'');validatePhone()">
      <span style="padding:9px 4px;color:var(--border);font-size:18px;line-height:1;background:var(--egold)">-</span>
      <input type="tel" id="f_phone" placeholder="509082142" class="phone-num"
        oninput="this.value=this.value.replace(/[^0-9]/g,'');validatePhone()">
    </div>
    <div class="phone-err" id="phoneErr">Enter country code (e.g. 971) and number (7–12 digits)</div>
    <div class="hint">Format: +[country code]-[number] &nbsp;·&nbsp; e.g. +971-509082142</div>
  </div>`;
}

function validatePhone(){
  var cc=document.getElementById('f_cc');
  var ph=document.getElementById('f_phone');
  var err=document.getElementById('phoneErr');
  if(!cc||!ph||!err)return true;
  var ccv=cc.value.trim(), phv=ph.value.trim();
  var wrap=cc.closest('.phone-wrap');
  var ok=ccv.length>=1&&ccv.length<=4&&phv.length>=7&&phv.length<=12;
  if(wrap) wrap.style.borderColor=(!ccv&&!phv)?'var(--border)':ok?'var(--green)':'var(--red)';
  err.style.display=(!ccv&&!phv)||ok?'none':'block';
  return ok;
}

function getPhoneValue(){
  var cc=(document.getElementById('f_cc')||{}).value||'';
  var ph=(document.getElementById('f_phone')||{}).value||'';
  return cc&&ph?'+'+cc+'-'+ph:'';
}

// ── "Book on behalf of" dropdown ─────────────────────────────────
// lockedUserId: if set, the field is read-only (slot already has an owner)
function behalfHTML(lockedUserId){
  if(!can('canViewOthers')) return ''; // sales users don't see this at all

  if(lockedUserId){
    // Slot already owned — lock to that user, no choice allowed
    var lockedUser = getUser(lockedUserId);
    var lockedName = lockedUser ? lockedUser.name : '—';
    return `<div class="fg" style="margin-bottom:1rem">
      <label>Booking attributed to</label>
      <div style="padding:9px 12px;background:var(--egold);border:1.5px solid var(--gold);border-radius:8px;font-weight:600;color:var(--dgold);font-size:13px">
        🔒 ${lockedName}
        <input type="hidden" id="f_behalf" value="${lockedUserId}">
      </div>
      <div class="hint" style="color:var(--orange)">⚠️ Slot is already claimed by ${lockedName} — all bookings on this slot must be attributed to them</div>
    </div>`;
  }

  // Free slot — show full dropdown
  var salesUsers = Object.values(CACHE.users).filter(u=>u.id!==CU.id);
  if(!salesUsers.length) return '';
  var opts = salesUsers.map(u=>`<option value="${u.id}">${u.name} (${(roles()[u.role]||{}).label||u.role})</option>`).join('');
  return `<div class="fg" style="margin-bottom:1rem">
    <label>Book on behalf of</label>
    <select id="f_behalf">
      <option value="">— Myself (${CU.name}) —</option>

    </select>
    <div class="hint">The selected rep will own this slot — future additions must be by the same rep</div>
  </div>`;
}

function getBehalfId(){
  var el = document.getElementById('f_behalf');
  return el && el.value ? el.value : CU.id;

// ── Book modal (first booking on a slot) ──────────────────────────
function openBook(venueId,date,slotKey){

    <div class="alert alert-ok">✅ This slot is available — the rep selected below will own it exclusively.</div>
    ${behalfHTML(null)}
    <div class="fr2">
      <div class="fg"><label class="req">Agency Name</label><input type="text" id="f_agency" placeholder="Agency name"></div>
      <div class="fg"><label class="req">Owner / Contact Name</label><input type="text" id="f_owner" placeholder="Full name"></div>
    </div>

// ── Add more agencies to existing slot ────────────────────────────
function openAddToSlot(venueId,date,slotKey){
  if(!can('canAddToOwnSlot')){alert('You do not have permission to add agencies to a slot.');return;}
  var owner = slotOwner(venueId,date,slotKey);
  // Sales user can only add to their own slot
  if(owner && owner!==CU.id && !can('canViewOthers')){
    alert('This slot belongs to another rep. You can only add agencies to your own slot.');return;
  }
  var venue=getVenue(venueId), slot=getSlots().find(s=>s.key===slotKey);
  var pax=slotPax(venueId,date,slotKey), remaining=(venue?venue.capacity:50)-pax;
  if(remaining<=0){alert('This slot is full ('+pax+'/'+( venue?venue.capacity:50)+' pax). No more agencies can be added.');return;}
  var ownerUser = getUser(owner);
  var ownerName = ownerUser ? ownerUser.name : '—';
  var isMySlot = owner===CU.id;

  document.getElementById('modalTitle').textContent='Add Agency to Slot';
  document.getElementById('modalBody').innerHTML=`
    <div class="alert alert-info">📅 ${fmtDate(date)} · ${slot?slot.label:''} · ${venue?venue.name:''}</div>
    <div class="alert alert-ok">🟦 ${isMySlot?'Your slot':'Slot owned by <strong>'+ownerName+'</strong>'} · ${pax} pax used · <strong>${remaining} pax remaining</strong></div>
    ${behalfHTML(owner)}
    <div class="fr2">
      <div class="fg"><label class="req">Agency Name</label><input type="text" id="f_agency" placeholder="Agency name"></div>
      <div class="fg"><label class="req">Owner / Contact Name</label><input type="text" id="f_owner" placeholder="Full name"></div>
    </div>
    <div class="fr2">
      ${phoneHTML()}
      <div class="fg"><label class="req">Attendees</label>
        <input type="number" id="f_att" min="1" max="${remaining}" value="1">
        <div class="hint">Max ${remaining} pax remaining in this slot</div></div>
    </div>
    <div class="fg"><label>Notes (internal)</label><textarea id="f_notes" placeholder="Interest level, follow-up…"></textarea></div>`;
  document.getElementById('modalFoot').innerHTML=`
    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    <button class="btn btn-gold" onclick="submitBook('${venueId}','${date}','${slotKey}',true)">Add Agency</button>`;
  document.getElementById('modal').style.display='flex';
}

function submitBook(venueId,date,slotKey,isAdd){
  var agency=document.getElementById('f_agency').value.trim();
  var owner=document.getElementById('f_owner').value.trim();
  var att=parseInt(document.getElementById('f_att').value)||1;
  var notes=document.getElementById('f_notes').value.trim();
  var phone=getPhoneValue();
  var behalfId=getBehalfId(); // who the booking is attributed to

  if(!agency||!owner){alert('Please fill all required fields.');return;}
  if(!validatePhone()){alert('Please enter a valid phone number in the format: +[country code]-[number]\nExample: +971-509082142');return;}

  // Slot ownership check — slot belongs to behalfId's user
  var slotOw=slotOwner(venueId,date,slotKey);
  if(!isAdd&&slotOw&&slotOw!==behalfId&&slotOw!==CU.id){
    alert('Slot was just taken by another rep. Please choose another slot.');closeModal();renderCalendar();return;
  }
  if(isAdd&&slotOw&&slotOw!==behalfId&&slotOw!==CU.id&&!can('canViewOthers')){
    alert('You cannot add to another rep\'s slot.');closeModal();return;
  }

  // Capacity check
  var venue=getVenue(venueId);
  var pax=slotPax(venueId,date,slotKey);
  if(pax+att>(venue?venue.capacity:50)){alert('Not enough capacity. Only '+(venue.capacity-pax)+' pax remaining.');return;}

  // Duplicate warning
  var dup=activeBk().find(b=>b.agencyName.toLowerCase()===agency.toLowerCase());
  if(dup&&!confirm('This agency already has a booking in this event. Add anyway?'))return;

  var id=uid();
  var bk={
    id,venueId,date,slotKey,
    agencyName:agency,ownerName:owner,phone,attendees:att,notes,
    bookedBy:behalfId,          // attributed to behalf user (or self)
    bookedByAdmin:behalfId!==CU.id?CU.id:null, // track who actually created it
    status:'confirmed',
    createdAt:new Date().toISOString()
  };
  DB.ref('/events/'+ACTIVE_EID+'/bookings/'+id).set(bk)
    .then(()=>{showSaved();closeModal();})
    .catch(e=>alert('Error saving: '+e.message));
}

    if(b.notes&&isOwn) html+=`<div style="margin-bottom:1rem"><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Your Notes</div><div style="background:var(--lgold);padding:10px;border-radius:6px;font-size:13px">${b.notes}</div></div>`;

function openAttendModal(id){

    <div class="alert alert-info">🏢 <b>${b.agencyName}</b> · ${b.attendees} pax registered</div>

function confirmAttend(id){

}

function setStatus(id,status,paxAttended){

}
function cancelBk(id){if(!confirm('Cancel this booking?'))return;DB.ref('/events/'+ACTIVE_EID+'/bookings/'+id).update({status:'cancelled',cancelledAt:new Date().toISOString(),cancelledBy:CU.id}).then(()=>{showSaved();closeModal();});}

document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});

function renderAgencies(){

// VIDEO SHOOTS
// ═══════════════════════════════════════════════════════════════════

// ── Schedule logic ────────────────────────────────────────────────
// Mon–Fri: 10:00–18:00 (4 slots: 10,12,14,16)
// Sat: 12:00–18:00 (3 slots: 12,14,16)
// Sun: closed
// Slot duration: 2 hours

var VS_DAY_SLOTS = {
  1:['10:00','12:00','14:00','16:00'], // Mon
  2:['10:00','12:00','14:00','16:00'], // Tue
  3:['10:00','12:00','14:00','16:00'], // Wed
  4:['10:00','12:00','14:00','16:00'], // Thu
  5:['10:00','12:00','14:00','16:00'], // Fri
  6:['12:00','14:00','16:00'],          // Sat
  0:[]                                  // Sun closed
};

var VS_SLOT_LABEL = {
  '10:00':'10:00 AM – 12:00 PM','12:00':'12:00 PM – 2:00 PM',
  '14:00':'2:00 PM – 4:00 PM','16:00':'4:00 PM – 6:00 PM'
};

var VS_DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var VS_DAY_FULL  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Get next N days that have slots (starting today)
function vsGetDays(n){
  var days=[], d=new Date(); d.setHours(0,0,0,0);
  while(days.length<n){
    var dow=d.getDay();
    if(VS_DAY_SLOTS[dow].length>0){
      var y=d.getFullYear(),mo=d.getMonth()+1,dy=d.getDate();
      days.push({
        date: y+'-'+pad(mo)+'-'+pad(dy),
        dow: dow,
        label: VS_DAY_FULL[dow]+', '+dy+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo-1]+' '+y,
        slots: VS_DAY_SLOTS[dow]
      });
    }
    d.setDate(d.getDate()+1);
  }
  return days;
}

function vsGetBookings(date,slotKey){ return Object.values(CACHE.videoBookings).filter(b=>b.date===date&&b.slotKey===slotKey&&b.status!=='cancelled'); }
function vsOurVideographerCount(date,slotKey){ return vsGetBookings(date,slotKey).filter(b=>b.needsVideographer).length; }
function vsCanBookOurVideographer(date,slotKey){ return vsOurVideographerCount(date,slotKey)<1; }
function vsCanBook(date,slotKey){ return vsGetBookings(date,slotKey).length<3; }

// ── Render ────────────────────────────────────────────────────────
function renderVideoShoots(){
  var isCreative=CU.role==='art_director'||CU.role==='videographer';
  var canBook=CU.role==='sales'||CU.role==='admin'||CU.role==='superadmin';
  var days=vsGetDays(14);

  var html=`<div class="page-header"><div class="ph-row">
    <div><div class="page-title">🎬 Video Shoots</div>
    <div class="page-sub">Agency video shoot bookings · 2-hour slots · Mon–Fri 10AM–6PM · Sat 12PM–6PM</div></div>
  </div></div>

  <div style="display:flex;gap:12px;margin-bottom:1rem;font-size:12px;flex-wrap:wrap">
    <span>🟢 Available</span>
    <span>🟡 Partial (1-2 booked)</span>
    <span>🔴 Full (3/3 booked)</span>
    <span>📹 Our videographer available</span>
    <span>🎥 Our videographer taken</span>
  </div>`;

  days.forEach(function(day){
    html+=`<div class="card" style="margin-bottom:1rem">
      <div class="card-title" style="font-size:14px;color:var(--dgold)">📅 ${day.label}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">`;
    day.slots.forEach(function(sk){
      var bks=vsGetBookings(day.date,sk);
      var total=bks.length, ourVid=vsOurVideographerCount(day.date,sk);
      var isFull=total>=3, isPartial=total>0&&total<3;
      var dot=isFull?'🔴':isPartial?'🟡':'🟢';
      var vidDot=ourVid>=1?'🎥 Our videographer taken':'📹 Our videographer free';
      html+=`<div style="border:1.5px solid ${isFull?'#fcc':isPartial?'#ffe082':'#c8e6c9'};border-radius:8px;padding:10px;background:${isFull?'#fff8f8':isPartial?'#fffde7':'#f1f8e9'}">
        <div style="font-weight:600;font-size:13px;margin-bottom:4px">${VS_SLOT_LABEL[sk]||sk}</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${dot} ${total}/3 booked · ${vidDot}</div>`;
      var myBks=bks.filter(function(b){return b.bookedBy===CU.id;});
      var otherBks=bks.filter(function(b){return b.bookedBy!==CU.id;});
      // My bookings — always visible
      myBks.forEach(function(b){
        html+=`<div style="background:#e8f5e9;border:1px solid #b2dfdb;border-radius:5px;padding:5px 8px;margin:3px 0;font-size:11px;cursor:pointer" onclick="viewVsBooking('${b.id}')">
          🏢 <b>${b.agencyName}</b>${b.needsVideographer?' 📹':''}<br>
          <span style="color:var(--green);font-size:10px">Your booking</span>
        </div>`;
      });
      if(CU.role==='sales'){
        // Sales: show count of other bookings but no details
        if(otherBks.length>0){
          html+=`<div style="background:#f5f5f5;border:1px solid #e0e0e0;border-radius:5px;padding:5px 8px;margin:3px 0;font-size:11px;color:#999;text-align:center">${otherBks.length} other booking${otherBks.length>1?'s':''} in this slot</div>`;
        }
      } else {
        // Admin / superadmin / art_director / videographer: see all bookings
        otherBks.forEach(function(b){
          html+=`<div style="background:#fff;border:1px solid #e0e0e0;border-radius:5px;padding:5px 8px;margin:3px 0;font-size:11px;cursor:pointer" onclick="viewVsBooking('${b.id}')">
            🏢 <b>${b.agencyName}</b>${b.needsVideographer?' 📹':''}<br>
            <span style="color:var(--muted)">${getUser(b.bookedBy)?getUser(b.bookedBy).name:'—'}</span>
          </div>`;
        });
      }
      if(!isFull&&canBook){
        html+=`<button class="btn btn-gold btn-xs" style="width:100%;margin-top:6px" onclick="openVsBook('${day.date}','${sk}')">+ Book Slot</button>`;
      }
      html+=`</div>`;
    });
    html+=`</div></div>`;
  });

  document.getElementById('content').innerHTML=html;
}

// ── Book modal ────────────────────────────────────────────────────
function openVsBook(date,slotKey){
  var bks=vsGetBookings(date,slotKey);
  if(bks.length>=3){alert('This slot is fully booked (3/3). Please choose another slot.');return;}
  var canOurVid=vsCanBookOurVideographer(date,slotKey);
  var dayObj=vsGetDays(14).find(function(d){return d.date===date;})||{label:date};

  document.getElementById('modalTitle').textContent='📹 Book Video Shoot Slot';
  document.getElementById('modalBody').innerHTML=`
    <div class="alert alert-info">📅 ${dayObj.label} · ${VS_SLOT_LABEL[slotKey]||slotKey}</div>
    <div class="alert alert-ok">${bks.length===0?'✅ Slot is empty — first booking':'🟡 '+(3-bks.length)+' space(s) remaining'} · Our videographer: ${canOurVid?'📹 Available':'🎥 Already booked'}</div>

    <div style="font-weight:600;font-size:13px;color:var(--dgold);margin-bottom:8px;margin-top:4px">Agency Information</div>
    <div class="fr2">
      <div class="fg"><label class="req">Agency Name</label><input type="text" id="vs_agency" placeholder="Agency name"></div>
      <div class="fg"><label class="req">Agency Owner Name</label><input type="text" id="vs_owner" placeholder="Full name"></div>
    </div>
    <div class="fr2">
      ${phoneHTMLId('vs_owner_phone','Agency Owner Mobile (WhatsApp)')}
      <div class="fg"><label class="req">Agency Official Email</label><input type="email" id="vs_email" placeholder="agency@example.com"></div>
    </div>

    <div style="font-weight:600;font-size:13px;color:var(--dgold);margin-bottom:8px;margin-top:8px">Agent Information</div>
    <div class="fr2">
      <div class="fg"><label class="req">Agent Name</label><input type="text" id="vs_agent" placeholder="Agent full name"></div>
      ${phoneHTMLId('vs_agent_phone','Agent Mobile (WhatsApp)')}
    </div>

    <div style="font-weight:600;font-size:13px;color:var(--dgold);margin-bottom:8px;margin-top:8px">Production Requirements</div>
    <div class="fg">
      <label class="req">Videographer</label>
      <select id="vs_vidneeded" onchange="onVsVidChange()">
        <option value="ours"${canOurVid?'':' disabled'}>📹 Use Vincitore videographer${canOurVid?'':' (already booked for this slot)'}</option>
        <option value="own">🎥 We have our own videographer</option>
      </select>
      ${!canOurVid?'<div class="hint" style="color:var(--orange)">⚠️ Vincitore videographer already booked for this slot — another agency has taken the slot. You can still book with your own videographer.</div>':''}
    </div>
    <div class="fg" id="vs_edit_wrap">
      <label class="req">Editing</label>
      <select id="vs_editneeded">
        <option value="ours">✂️ Vincitore team will edit</option>
        <option value="own">🎬 We will edit ourselves</option>
      </select>
    </div>
    <div class="fg"><label>Notes</label><textarea id="vs_notes" placeholder="Any special requirements, concept, duration…"></textarea></div>`;

  document.getElementById('modalFoot').innerHTML=`
    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    <button class="btn btn-gold" onclick="submitVsBook('${date}','${slotKey}')">Confirm Booking</button>`;
  document.getElementById('modal').style.display='flex';
  onVsVidChange();
}

function onVsVidChange(){
  var val=document.getElementById('vs_vidneeded');
  if(!val)return;
  var editWrap=document.getElementById('vs_edit_wrap');
  if(editWrap){
    if(val.value==='own'){
      editWrap.style.opacity='.4';
      editWrap.style.pointerEvents='none';
      document.getElementById('vs_editneeded').value='own';
    }else{
      editWrap.style.opacity='1';
      editWrap.style.pointerEvents='auto';
    }
  }
}

// Reusable phone HTML with custom IDs
function phoneHTMLId(idBase, labelText){
  return `<div class="fg">
    <label class="req">${labelText}</label>
    <div class="phone-wrap">
      <span class="phone-cc">+</span>
      <input type="text" id="${idBase}_cc" placeholder="971" maxlength="4"
        style="width:64px;border:none;background:var(--egold);font-weight:600;color:var(--dgold);padding:9px 6px;outline:none;text-align:center"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      <span style="padding:9px 4px;color:var(--border);font-size:18px;line-height:1;background:var(--egold)">-</span>
      <input type="tel" id="${idBase}_num" placeholder="509082142" class="phone-num"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>
    <div class="hint">Format: +[country code]-[number]</div>
  </div>`;
}

function getPhoneById(idBase){
  var cc=(document.getElementById(idBase+'_cc')||{}).value||'';
  var num=(document.getElementById(idBase+'_num')||{}).value||'';
  return cc&&num?'+'+cc+'-'+num:'';
}

function submitVsBook(date,slotKey){
  var agency  = document.getElementById('vs_agency').value.trim();
  var owner   = document.getElementById('vs_owner').value.trim();
  var ownerPh = getPhoneById('vs_owner_phone');
  var email   = document.getElementById('vs_email').value.trim();
  var agent   = document.getElementById('vs_agent').value.trim();
  var agentPh = getPhoneById('vs_agent_phone');
  var needsVid= document.getElementById('vs_vidneeded').value==='ours';
  var needsEdit= document.getElementById('vs_editneeded').value==='ours';
  var notes   = document.getElementById('vs_notes').value.trim();

  if(!agency||!owner||!ownerPh||!email||!agent||!agentPh){alert('Please fill all required fields.');return;}
  if(vsGetBookings(date,slotKey).length>=3){alert('Slot just became full. Please choose another.');closeModal();renderVideoShoots();return;}
  if(needsVid&&!vsCanBookOurVideographer(date,slotKey)){alert('Our videographer was just booked by another agency. Please select your own videographer or choose a different slot.');return;}

  var id='vs'+Date.now()+Math.random().toString(36).substr(2,5);
  var booking={
    id, date, slotKey,
    agencyName:agency, ownerName:owner, ownerPhone:ownerPh, agencyEmail:email,
    agentName:agent, agentPhone:agentPh,
    needsVideographer:needsVid, needsEditing:needsVid?needsEdit:false,
    notes, bookedBy:CU.id, status:'confirmed',
    createdAt:new Date().toISOString()
  };

  DB.ref('/video_bookings/'+id).set(booking).then(function(){
    showSaved();
    closeModal();
    renderVideoShoots();
  }).catch(function(e){alert('Error: '+e.message);});
}

// ── View booking ──────────────────────────────────────────────────
function viewVsBooking(id){
  var b=CACHE.videoBookings[id]; if(!b)return;
  // Sales can only view their own bookings
  if(CU.role==='sales'&&b.bookedBy!==CU.id){alert('You can only view your own video shoot bookings.');return;}
  var rep=getUser(b.bookedBy);
  var dayObj=vsGetDays(14).find(function(d){return d.date===b.date;})||{label:b.date};
  var canCancel=CU.role==='superadmin'||CU.role==='admin';

  document.getElementById('modalTitle').textContent='Video Shoot Details';
  document.getElementById('modalBody').innerHTML=`
    <div class="alert alert-info">📅 ${dayObj.label||b.date} · ${VS_SLOT_LABEL[b.slotKey]||b.slotKey}</div>
    <div class="g2" style="margin-bottom:1rem">
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Status</div><span class="badge badge-${b.status}">${b.status}</span></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Booked By</div><strong>${rep?rep.name:'—'}</strong></div>
    </div>
    <div style="font-weight:600;font-size:12px;color:var(--dgold);margin-bottom:6px">Agency</div>
    <div class="g2" style="margin-bottom:1rem">
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Agency Name</div><strong style="font-size:15px">${b.agencyName}</strong></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Owner</div>${b.ownerName}</div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Owner Phone</div><a href="https://wa.me/${b.ownerPhone.replace(/[^0-9]/g,'')}" style="color:var(--blue)">${b.ownerPhone} 💬</a></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Email</div><a href="mailto:${b.agencyEmail}" style="color:var(--blue)">${b.agencyEmail}</a></div>
    </div>
    <div style="font-weight:600;font-size:12px;color:var(--dgold);margin-bottom:6px">Agent</div>
    <div class="g2" style="margin-bottom:1rem">
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Agent Name</div><strong>${b.agentName}</strong></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Agent Phone</div><a href="https://wa.me/${b.agentPhone.replace(/[^0-9]/g,'')}" style="color:var(--blue)">${b.agentPhone} 💬</a></div>
    </div>
    <div style="font-weight:600;font-size:12px;color:var(--dgold);margin-bottom:6px">Production</div>
    <div class="g2" style="margin-bottom:1rem">
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Videographer</div><span style="font-weight:600;color:${b.needsVideographer?'var(--blue)':'var(--green)'}">${b.needsVideographer?'📹 Vincitore videographer':'🎥 Own videographer'}</span></div>
      <div><div style="font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">Editing</div><span style="font-weight:600">${b.needsEditing?'✂️ Vincitore team':'🎬 Self-editing'}</span></div>
    </div>
    ${b.notes?`<div style="background:var(--lgold);padding:10px;border-radius:6px;font-size:13px;margin-bottom:1rem">${b.notes}</div>`:''}
    <div style="border-top:1px solid var(--border);padding-top:10px;font-size:11px;color:var(--muted)">Booked: ${fmtDT(b.createdAt)}</div>`;

  var foot=`<button class="btn btn-outline" onclick="closeModal()">Close</button>`;
  if(canCancel&&b.status!=='cancelled') foot+=`<button class="btn btn-red btn-sm" onclick="cancelVsBook('${id}')">Cancel</button>`;
  document.getElementById('modalFoot').innerHTML=foot;
  document.getElementById('modal').style.display='flex';
}

function cancelVsBook(id){
  if(!confirm('Cancel this video shoot booking?'))return;
  DB.ref('/video_bookings/'+id+'/status').set('cancelled').then(function(){showSaved();closeModal();});
}

// ── Export ────────────────────────────────────────────────────────
function exportCSV(){
  if(!can('canExport')){alert('Access denied.');return;}
  var rows=[['ID','Date','Slot','Venue','Agency','Owner','Phone','Attendees','Booked By','Status','Notes','Created At']];
  allBk().forEach(b=>{
    var v=getVenue(b.venueId),s=getSlots().find(x=>x.key===b.slotKey),rep=getUser(b.bookedBy);
    rows.push([b.id,b.date,s?s.label:'',v?v.name:'',b.agencyName,b.ownerName,b.phone,b.attendees,rep?rep.name:'',b.status,b.notes||'',fmtDT(b.createdAt)]);
  });
  var csv=rows.map(r=>r.map(v=>'"'+(v+'').replace(/"/g,'""')+'"').join(',')).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='vincitore_bookings_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
}
</script></body></html>
